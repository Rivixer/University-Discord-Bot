syntax = "proto3";

package voice_channel.v1;

message CreateVoiceChannelRequest{
  int64 guild_id = 1;
  optional int64 category_id = 2;
  string name = 3;
}

message DeleteVoiceChannelRequest{
  int64 guild_id = 1;
  int64 channel_id = 2;
}

message RenameVoiceChannelRequest {
  int64 guild_id    = 1;
  int64 channel_id  = 2;
  string new_name   = 3;
}
