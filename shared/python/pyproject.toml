[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Shared library for university discord bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
proto = [
  "protobuf~=6.31",
  "grpcio~=1.73.0",
]
redis = [
  "redis~=6.2.0",
]
redis-dev = [
  "redis~=5.0",
  "types-redis~=4.6.0",
]
pydantic = [
  "pydantic~=2.11.7",
]

[tool.ruff]
exclude = ["shared/gen"]

[tool.setuptools]
packages = ["shared"]

[tool.setuptools.package-data]
"shared" = ["py.typed"]